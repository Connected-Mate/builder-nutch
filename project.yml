name: Codenotch
options:
  bundleIdPrefix: com.connectedmate
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # Sparkle compares CFBundleVersion to decide what is newer, and
    # Sources/Info.plist reads both from here — hardcoding them there instead
    # silently pins every build to one version, so no customer ever sees an
    # update. Bump CURRENT_PROJECT_VERSION on every release.
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    # Local builds work without a signing identity. Release builds override this
    # with the fork maintainer's own Developer ID; never use upstream's team.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Codenotch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        # Deliberately a normal Dock app, not an `LSUIElement` agent. The
        # notch is ambient, but the *app* still has to be findable: without a
        # Dock tile there is nothing to click to open it, nothing in Cmd-Tab,
        # and no obvious way to reach settings or quit.
        CFBundleName: Codenotch Accounts
        CFBundleDisplayName: Codenotch Accounts
        LSMinimumSystemVersion: "26.0"
        # Sources/Info.plist is *generated* from this block, so editing that
        # file directly is undone by the next `make gen`. Pointing both at the
        # build settings keeps one place to bump.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Upstream's signed updates must never replace this community fork.
        # A future release can configure its own feed and public signing key.
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connectedmate.codenotch-accounts
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  CodenotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Codenotch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connectedmate.codenotch-accounts.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Codenotch:
    build:
      targets:
        Codenotch: all
        CodenotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - CodenotchTests
